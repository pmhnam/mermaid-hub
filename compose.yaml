services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diagram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: diagram
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagram -d diagram"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build:
      context: ./diagram-api
    restart: unless-stopped
    environment:
      COOKIE_SECURE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      APP_URL: ${APP_URL:-}
      DATABASE_URL: postgresql://diagram:${POSTGRES_PASSWORD}@postgres:5432/diagram
      DB_MIGRATIONS_RUN: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      PUBLIC_LINK_SECRET: ${PUBLIC_LINK_SECRET:?PUBLIC_LINK_SECRET is required}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    build:
      context: ./diagram-web
      target: mermaid
    container_name: mermaid-workspace-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - internal
      - proxy

volumes:
  postgres-data:

networks:
  internal:
  proxy:
    name: proxy
    external: true
