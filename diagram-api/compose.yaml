services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: diagram
      POSTGRES_USER: diagram
      POSTGRES_PASSWORD: diagram
    ports:
      - "5432:5432"
    volumes:
      - diagram-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagram -d diagram"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  diagram-postgres:
